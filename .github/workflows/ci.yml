name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: swift test

      - name: Build app (universal, ad-hoc signed)
        run: ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateDNS-app
          path: build/PrivateDNS.zip
          if-no-files-found: error
